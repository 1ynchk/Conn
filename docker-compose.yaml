
networks:

  mynetwork:
    driver: bridge
    ipam:
      config:
        - subnet: 10.168.0.0/24
          gateway: 10.168.0.1


services:

  backend_server:

    build:
      context: ./backend
      dockerfile: dockerfile

    ports:
      - "8000:8000"

    networks:
      mynetwork:
        ipv4_address: 10.168.0.2

    environment:
        - DB_NAME=${DB_NAME}
        - DB_HOST=${DB_HOST}
        - DB_PORT=${DB_PORT}
        - DB_PASSWORD=${DB_PASSWORD}
        - DB_USER=${DB_USER}
        - IS_DEBUG="true"

  frontend_server:

    build: 
      context: ./frontend
      dockerfile: dockerfile

    ports:
      - "80:80"
      - "443:443"

    environment:
      BACKEND_URL: 10.168.0.2

    depends_on: 
      - backend_server

    networks:
      mynetwork:
        ipv4_address: 10.168.0.4
